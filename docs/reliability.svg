<text x="56" y="186.4" class="muted" font-size="11" text-anchor="end">0.6</text>
<text x="325.6" y="402" class="muted" font-size="11" text-anchor="middle">0.6</text>
<line x1="64" x2="500" y1="115.2" y2="115.2" class="grid" stroke-width="1"/>
<text x="56" y="119.2" class="muted" font-size="11" text-anchor="end">0.8</text>
<text x="412.8" y="402" class="muted" font-size="11" text-anchor="middle">0.8</text>
<line x1="64" x2="500" y1="48.0" y2="48.0" class="grid" stroke-width="1"/>
<text x="56" y="52.0" class="muted" font-size="11" text-anchor="end">1.0</text>
