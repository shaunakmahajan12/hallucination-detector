<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="t d">
<title id="t">Reliability diagram, fine-tuned detector on RAGTruth test</title>
<desc id="d">Observed hallucination rate against mean predicted probability in ten bins. Raw scores (ECE 0.043) sit below the diagonal at high scores; Platt-calibrated scores (ECE 0.0157) track it closely.</desc>
<style>
.surface { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.grid { stroke: #e1e0d9; } .axis { stroke: #c3c2b7; } .diag { stroke: #898781; }
.s1 { stroke: #2a78d6; } .s1f { fill: #2a78d6; } .s2 { stroke: #eb6834; } .s2f { fill: #eb6834; }
.ring { stroke: #fcfcfb; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
  .s1 { stroke: #3987e5; } .s1f { fill: #3987e5; } .s2 { stroke: #d95926; } .s2f { fill: #d95926; }
  .ring { stroke: #1a1a19; }
}
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
<rect width="640" height="440" class="surface"/>
<text x="64" y="22" class="ink" font-size="15" font-weight="600">Calibration on RAGTruth test (18,965 sentences)</text>
<text x="64" y="39" class="ink2" font-size="12">Points above the diagonal: model under-predicts; below: over-confident</text>
